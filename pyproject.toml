[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argon-vault"
version = "1.0.0"
description = "Argon - a local-first, zero-knowledge secrets vault (Argon2id + AES-256-GCM) with a CLI and a local web UI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Argon" }]
keywords = ["vault", "password-manager", "argon2id", "aes-gcm", "totp"]
dependencies = [
  "argon2-cffi>=23.1.0",
  "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
argon = "argon.cli:main"

[tool.setuptools.packages.find]
include = ["argon*"]

[tool.setuptools.package-data]
argon = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
